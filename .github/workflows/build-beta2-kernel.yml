name: Build UGREEN kernel 6.18.47-Unraid

on:
  workflow_dispatch:
  push:
    branches: [master, codex/kernel-slackbuild]
    paths:
      - .github/workflows/build-beta2-kernel.yml
      - source/ugreen-driver.SlackBuild
      - source/build-beta2-in-container.sh

permissions:
  contents: read

concurrency:
  group: ugreen-beta2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILDER: ghcr.io/ich777/unraid_kernel@sha256:4de2638e4614878b0a55df8bf7db93a8b643d6f221904a846d532c719b84440f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download and authenticate fixed beta2 inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ugreen-inputs" "$RUNNER_TEMP/ugreen-runtime" "$RUNNER_TEMP/ugreen-assets"
          cd "$RUNNER_TEMP/ugreen-inputs"
          curl --fail --location --retry 3 -o linux.tar.xz https://github.com/ich777/unraid_kernel/releases/download/6.18.47-Unraid/linux-6.18.47-Unraid.tar.xz
          curl --fail --location --retry 3 -o controller.tar.gz https://codeload.github.com/miskcoo/ugreen_leds_controller/tar.gz/992fc6dcb5da4cfc9aa25561eff2f584c06f586d
          curl --fail --location --retry 3 -o unraid.zip https://releases.unraid.net/dl/next/7.4.0-beta.2/0ecadeb5b9c44b3df60368a323d2c91c5c3c1f54321b4a8abd25587e9583207e/unRAIDServer-7.4.0-beta.2-x86_64.zip
          printf '%s\n' \
            '72822aea43a7d6dab3ae7a8489481a583504896927c1ce7117df8ab1b46d173f  linux.tar.xz' \
            'a3e47c0fac4a3a099b2b83e366a436565ce2c77f7b05fd10c25ab1355d785c19  controller.tar.gz' \
            'b214c9583bff4bdb3847a7ca1cc43fc7b31c8e6a2995a8c2727185ccccb9f9fc  unraid.zip' | sha256sum -c -
          unzip -j unraid.zip bzroot bzimage -d "$RUNNER_TEMP/ugreen-runtime"

      - name: Extract stock beta2 modules without executing Unraid
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cpio zstd
          cd "$RUNNER_TEMP/ugreen-runtime"
          printf '%s\n' \
            '2cc8ca2545421163ec14090afdfe13e41128f4538788dcfe26850dc95fb63c4c  bzroot' \
            '0d15573da3fb41647bb2615133f5e86febabc0e769c3a67b74cd01bd20f5bae8  bzimage' | sha256sum -c -
          # Offset belongs to this exact checksum-pinned initramfs only.
          dd if=bzroot bs=512 skip=35184 status=none | zstd -dc |
            cpio --no-absolute-filenames --no-preserve-owner -idm 'lib/modules/*' 'etc/unraid-version'

      - name: Build and validate on Linux-native container storage
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$BUILDER"
          docker run --rm --platform linux/amd64 --network none \
            --entrypoint /bin/bash \
            -e BUILDER -e GITHUB_SHA -e GITHUB_RUN_ID \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/ugreen-inputs:/inputs:ro" \
            -v "$RUNNER_TEMP/ugreen-runtime:/runtime:ro" \
            -v "$RUNNER_TEMP/ugreen-assets:/export" \
            "$BUILDER" /repo/source/build-beta2-in-container.sh

      - name: Upload kernel-specific test asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ugreen-leds-6.18.47-Unraid-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ugreen-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Explain test status
        shell: bash
        run: |
          printf '%s\n' \
            '### 6.18.47-Unraid kernel test asset' \
            'Compiled on Linux-native storage. Package ownership and modes, stock vermagic, and symbol dependencies passed.' \
            'Kernel module only: no glibc, i2c-tools, monitor, replacement stock modules, or autostart.' \
            'Read compatibility.txt. Hardware and the reported network failure remain untested.' >> "$GITHUB_STEP_SUMMARY"
